<rect x="60" y="706" width="1080" height="66" fill="#FFFFFF" stroke="#155E8C" stroke-width="2"/>
<text x="600" y="750" font-family="Hiragino Sans GB" font-size="30" fill="#155E8C" text-anchor="middle">根因不在栈里，在栈旁边</text>

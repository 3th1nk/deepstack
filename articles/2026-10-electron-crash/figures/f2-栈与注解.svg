<text x="648" y="588" font-family="Hiragino Sans GB" font-size="20" fill="#333333">上一次导航还没结束，新的就来了</text>
<text x="648" y="626" font-family="Hiragino Sans GB" font-size="20" fill="#333333">强线索，不是因果证明</text>

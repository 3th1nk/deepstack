<text x="88" y="578" font-family="Hiragino Sans GB" font-size="20" fill="#333333">能读出的上限：有几帧偏移挨得近</text>
<text x="88" y="616" font-family="Hiragino Sans GB" font-size="20" fill="#333333">再往下，都是脑补</text>
<text x="88" y="654" font-family="Hiragino Sans GB" font-size="17" fill="#9AA3AD">栈告诉你「在哪」</text>

<rect x="620" y="100" width="520" height="580" fill="#FFFFFF" stroke="#155E8C" stroke-width="2"/>
<text x="648" y="146" font-family="Hiragino Sans GB" font-size="22" fill="#155E8C">Crashpad 注解 · 崩溃瞬间写入</text>
<line x1="648" y1="162" x2="1112" y2="162" stroke="#E1E5E9" stroke-width="2"/>

<rect x="648" y="184" width="464" height="52" fill="#C77F1E"/>
<text x="668" y="217" font-family="Menlo" font-size="17" fill="#FFFFFF">nav_..._Reload_check = true</text>


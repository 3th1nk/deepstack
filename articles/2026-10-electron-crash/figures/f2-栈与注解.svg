<text x="668" y="281" font-family="Menlo" font-size="17" fill="#333333">nav_..._Reload_type = 1</text>

<rect x="648" y="312" width="464" height="52" fill="#C77F1E"/>
<text x="668" y="345" font-family="Menlo" font-size="17" fill="#FFFFFF">prev_pending_entry_id = 183</text>

<rect x="648" y="376" width="464" height="52" fill="#C77F1E"/>
<text x="668" y="409" font-family="Menlo" font-size="17" fill="#FFFFFF">pending_entry_id = 183   ← 相同</text>

<rect x="648" y="440" width="464" height="52" fill="#FFFFFF" stroke="#E1E5E9" stroke-width="2"/>

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="383" viewBox="0 0 900 383">
<rect width="900" height="383" fill="#FFFFFF"/>

<!-- 左：文案区 -->
<text x="64" y="165" font-family="Hiragino Sans GB" font-size="42" fill="#155E8C">根因不在栈里</text>
<text x="64" y="219" font-family="Hiragino Sans GB" font-size="42" fill="#C77F1E">在栈旁边</text>
<text x="64" y="271" font-family="Hiragino Sans GB" font-size="15" fill="#9AA3AD">没有符号表的时候，崩溃栈该怎么读</text>

<!-- 右：探照灯光锥 -->
<polygon points="660,84 500,330 850,330" fill="#C77F1E" opacity="0.10"/>

<!-- 右：裸地址栈（没有路牌的街区），越往下越暗 -->
<text x="440" y="110" font-family="Menlo" font-size="15" fill="#9AA3AD" opacity="0.55">+0x68CF3DB</text>
<text x="440" y="135" font-family="Menlo" font-size="15" fill="#9AA3AD" opacity="0.48">+0x68D1C6C</text>
<text x="440" y="160" font-family="Menlo" font-size="15" fill="#9AA3AD" opacity="0.41">+0x68D1DAC</text>
<text x="440" y="185" font-family="Menlo" font-size="15" fill="#9AA3AD" opacity="0.34">+0x68D1D76</text>
<text x="440" y="235" font-family="Menlo" font-size="15" fill="#9AA3AD" opacity="0.27">0x00000000</text>
<text x="440" y="260" font-family="Menlo" font-size="15" fill="#9AA3AD" opacity="0.22">0x7ff6a8c9d1e4</text>
<text x="440" y="285" font-family="Menlo" font-size="15" fill="#9AA3AD" opacity="0.18">0x0000024f1a3c08d0</text>
<text x="440" y="310" font-family="Menlo" font-size="15" fill="#9AA3AD" opacity="0.14">0x00007ff6a9c2f1b0</text>

<!-- 光锥照到的那一行：裸地址变成注解 -->
<rect x="430" y="198" width="420" height="24" fill="#C77F1E" opacity="0.14"/>
<text x="440" y="215" font-family="Menlo" font-size="15" fill="#C77F1E">nav_reentrancy-pending_entry_id=183</text>

<!-- 底部：栈与注解的分界 -->
<line x1="64" y1="336" x2="836" y2="336" stroke="#E0E0E0" stroke-width="1"/>
</svg>
